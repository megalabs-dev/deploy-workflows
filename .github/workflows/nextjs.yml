name: Deploy Next.js (reusable)

on:
  workflow_call:
    inputs:
      service:
        description: Tên service trên server (trùng --name của add-site.sh)
        type: string
        required: true
      build_args:
        description: Các dòng KEY=VALUE cho docker build (NEXT_PUBLIC_*)
        type: string
        default: ""
      ssh_user:
        type: string
        default: ubuntu
      apps_dir:
        type: string
        default: "~/apps"
    secrets:
      SSH_HOST:
        required: true
      SSH_KEY:
        required: true
      BUILD_ENV:
        description: Toàn bộ env (dạng file .env) cho lúc next build. add-site.sh tự đặt khi có --env-file
        required: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    concurrency:
      group: deploy-${{ github.repository }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - name: Image name (lowercase)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        env:
          BUILD_ENV: ${{ secrets.BUILD_ENV }}
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          build-args: ${{ inputs.build_args }}
          secret-envs: build_env=BUILD_ENV
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy qua SSH (pull, restart, chờ healthy, rollback nếu lỗi)
        uses: appleboy/ssh-action@v1
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SERVICE: ${{ inputs.service }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ inputs.ssh_user }}
          key: ${{ secrets.SSH_KEY }}
          envs: GHCR_USER,GHCR_TOKEN,IMAGE,SERVICE
          script: |
            set -eu
            cd ${{ inputs.apps_dir }}
            trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

            health() {
              docker inspect -f '{{.State.Health.Status}}' "$(docker compose ps -q "$SERVICE")" 2>/dev/null || echo none
            }
            wait_healthy() {
              for i in $(seq 1 60); do
                [ "$(health)" = "healthy" ] && return 0
                sleep 3
              done
              return 1
            }

            # Image đang chạy, dùng để rollback
            OLD="$(docker inspect -f '{{.Image}}' "$(docker compose ps -q "$SERVICE" 2>/dev/null)" 2>/dev/null || true)"

            docker compose pull "$SERVICE"
            docker compose up -d "$SERVICE"
            if wait_healthy; then
              echo "healthy"
              docker image prune -f >/dev/null
              exit 0
            fi

            echo "Container không healthy sau 3 phút, log gần nhất:"
            docker compose logs --tail 60 "$SERVICE" || true
            if [ -n "$OLD" ]; then
              echo "==> Rollback về image cũ $OLD"
              docker tag "$OLD" "$IMAGE:latest"
              docker compose up -d --force-recreate "$SERVICE"
              if wait_healthy; then echo "Đã rollback, site chạy bản cũ"; else echo "Rollback cũng không healthy!"; fi
            fi
            exit 1
